name: Verify simulation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: python:3.12.10-bookworm@sha256:91487c05f87617b9d1165274c07a9b0040dfef21a855b5b418a0ebc6aa26c5de
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install compiler
        run: |
          apt-get update -o APT::Update::Error-Mode=any
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends g++
      - name: Build native codec and run checks
        run: ./scripts/verify.sh
